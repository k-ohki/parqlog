[package]
name = "parqlog-app"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "parqlog 管理・簡易確認アプリ（Tauri 2）"

# ルートのワークスペースとは別に単独でビルドする（Tauri の依存を parqlog-core と混ぜない）
[workspace]

[lib]
name = "parqlog_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-dialog = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
ureq = { version = "3", default-features = false, features = ["json"] }

[profile.release]
lto = "thin"
codegen-units = 4
strip = true
